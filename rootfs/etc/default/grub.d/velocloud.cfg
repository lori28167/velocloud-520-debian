# Console on the mini-USB jack = COM2 (ttyS1).  GRUB_DEFAULT=saved lets the
# kernel hook keep booting a kernel that has the VeloCloud igb module.
GRUB_DEFAULT=saved
GRUB_TIMEOUT=5
GRUB_CMDLINE_LINUX="console=ttyS1,115200n8 acpi_enforce_resources=lax"
GRUB_CMDLINE_LINUX_DEFAULT=""
GRUB_TERMINAL="serial"
GRUB_SERIAL_COMMAND="serial --unit=1 --speed=115200 --word=8 --parity=no --stop=1"
GRUB_DISABLE_OS_PROBER=true
